    restart: unless-stopped

  shipping-service:
    build:
      context: ../services/shipping-service
    env_file: *java-files
    environment:
      SERVER_PORT: "8086"
      JAVA_OPTS: ${SHIPPING_JAVA_OPTS:--Xms48m -Xmx160m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:MaxMetaspaceSize=96m -Xss256k}
    ports:
      - "8086:8086"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-service:
        condition: service_started
    restart: unless-stopped

  cache-service:
    build:
      context: ../services/cache-service
    env_file: *java-files
    environment:
      SERVER_PORT: "8087"
      JAVA_OPTS: ${CACHE_JAVA_OPTS:--Xms48m -Xmx160m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:MaxMetaspaceSize=96m -Xss256k}
    ports:
      - "8087:8087"
    depends_on:
      redis:
        condition: service_healthy
      discovery-service:
        condition: service_started
    restart: unless-stopped

  report-service:
    build:
      context: ../services/report-service
    env_file: *java-files
    environment:
      SERVER_PORT: "8088"
      JAVA_OPTS: ${REPORT_JAVA_OPTS:--Xms48m -Xmx160m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:MaxMetaspaceSize=96m -Xss256k}
    ports:
      - "8088:8088"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-service:
        condition: service_started
    restart: unless-stopped

  webapp:
    build:
      context: ../webapp
    environment:
      VITE_API_PROXY: http://gateway-service:8080
    ports:
      - "5173:5173"
    depends_on:
      - gateway-service
    restart: unless-stopped

volumes:
  apex-pg:
  apex-minio:
