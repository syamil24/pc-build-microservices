spring:
  config:
    import: classpath:apex-defaults.yml
  application:
    name: cache-service
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8087}

management:
  health:
    redis:
      enabled: false

apex:
  cache:
    client-enabled: false
