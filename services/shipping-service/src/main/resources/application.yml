spring:
  config:
    import: classpath:apex-defaults.yml
  application:
    name: shipping-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/apex_shipping
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:3}
      minimum-idle: 1
  kafka:
    consumer:
      group-id: shipping-service

server:
  port: ${SERVER_PORT:8086}

apex:
  shipping-tick-ms: ${SHIPPING_TICK_MS:15000}
